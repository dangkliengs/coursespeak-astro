name: Deploy Astro Site

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup Node
      uses: actions/setup-node@v5
      with:
        node-version: '24.0.0'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Switch to Production Mode
      run: npm run mode:prod

    - name: Build
      run: npm run build
      env:
        TZ: Asia/Jakarta

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
      with:
        timeout: 600000
